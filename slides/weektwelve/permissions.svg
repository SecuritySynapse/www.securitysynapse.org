<svg class='svgbob' height='144' preserveAspectRatio='xMidYMid meet' viewBox='0 0 336 144' width='336' xmlns='http://www.w3.org/2000/svg' role='img' aria-labelledby='permissions-title permissions-desc'>
  <title id='permissions-title'>Unix file permission bits for owner, group, and other</title>
  <desc id='permissions-desc'>Each of the owner, group, and other triads has a read, write, and execute bit. Read is 4, write is 2, and execute is 1, so a full triad sums to 7. The command chmod 640 sets the owner triad to read and write (4 + 2 = 6), the group triad to read (4), and the other triad to no permissions (0).</desc>
  <style>.svgbob line, .svgbob path, .svgbob circle, .svgbob rect, .svgbob polygon {
  stroke: black;
  stroke-width: 2;
  stroke-opacity: 1;
  fill-opacity: 1;
  stroke-linecap: round;
  stroke-linejoin: miter;
}

.svgbob text {
  white-space: pre;
  fill: black;
  font-family: Iosevka Fixed, monospace;
  font-size: 14px;
}

.svgbob rect.backdrop {
  stroke: none;
  fill: white;
}

.svgbob .broken {
  stroke-dasharray: 8;
}

</style>
